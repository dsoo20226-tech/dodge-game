<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>별똥별 피하기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b1020;
    color: #e8ecff;
    font-family: "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
    user-select: none;
  }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .hud { display: flex; gap: 24px; margin-bottom: 8px; font-size: 16px; }
  canvas {
    background: linear-gradient(#141a35, #0b1020);
    border: 2px solid #2c3870;
    border-radius: 12px;
    width: 100%;
    max-width: 400px;
    aspect-ratio: 2 / 3;
    touch-action: none;
  }
  .help { margin-top: 10px; font-size: 13px; color: #8a93c0; text-align: center; }
</style>
</head>
<body>
  <h1>🌠 별똥별 피하기</h1>
  <div class="hud">
    <div>점수: <b id="score">0</b></div>
    <div>최고: <b id="best">0</b></div>
  </div>
  <canvas id="game" width="400" height="600"></canvas>
  <p class="help">← → 방향키 또는 A / D 로 이동 · 마우스/터치로도 움직일 수 있어요<br>스페이스바 또는 클릭으로 시작</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");

// 최고 점수 불러오기 (저장이 안 되는 환경이어도 게임은 돌아가게)
let best = 0;
try { best = Number(localStorage.getItem("dodge-best")) || 0; } catch (e) {}
bestEl.textContent = best;

const player = { x: W / 2, y: H - 50, r: 16, speed: 6 };
let stars = [];
let score = 0;
let state = "ready"; // ready | playing | over
let keys = {};
let pointerX = null;
let spawnTimer = 0;
let lastTime = 0;

function reset() {
  player.x = W / 2;
  stars = [];
  score = 0;
  spawnTimer = 0;
  state = "playing";
}

// 시간이 지날수록 어려워짐
function difficulty() {
  return 1 + score / 600;
}

function spawnStar() {
  const r = 8 + Math.random() * 14;
  stars.push({
    x: r + Math.random() * (W - r * 2),
    y: -r,
    r,
    vy: (2 + Math.random() * 2.5) * difficulty(),
    vx: (Math.random() - 0.5) * 1.2,
  });
}

function update(dt) {
  if (state !== "playing") return;

  // 이동
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) player.x -= player.speed * dt;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) player.x += player.speed * dt;
  if (pointerX !== null) player.x += (pointerX - player.x) * 0.25 * dt;
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));

  // 별똥별 생성
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnStar();
    spawnTimer = Math.max(6, 30 / difficulty());
  }

  // 별똥별 이동 + 충돌 검사
  for (const s of stars) {
    s.y += s.vy * dt;
    s.x += s.vx * dt;
    const dx = s.x - player.x, dy = s.y - player.y;
    if (Math.hypot(dx, dy) < s.r + player.r - 4) {
      gameOver();
      return;
    }
  }
  stars = stars.filter(s => s.y - s.r < H);

  score += dt;
  scoreEl.textContent = Math.floor(score / 6);
}

function gameOver() {
  state = "over";
  const final = Math.floor(score / 6);
  if (final > best) {
    best = final;
    bestEl.textContent = best;
    try { localStorage.setItem("dodge-best", best); } catch (e) {}
  }
}

function drawPlayer() {
  ctx.fillStyle = "#5ad1ff";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  // 눈
  ctx.fillStyle = "#0b1020";
  ctx.beginPath();
  ctx.arc(player.x - 5, player.y - 3, 2.5, 0, Math.PI * 2);
  ctx.arc(player.x + 5, player.y - 3, 2.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawStar(s) {
  // 꼬리
  const grad = ctx.createLinearGradient(s.x, s.y - s.r * 4, s.x, s.y);
  grad.addColorStop(0, "rgba(255,180,80,0)");
  grad.addColorStop(1, "rgba(255,180,80,0.6)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(s.x - s.r * 0.7, s.y);
  ctx.lineTo(s.x + s.r * 0.7, s.y);
  ctx.lineTo(s.x, s.y - s.r * 4);
  ctx.fill();
  // 몸통
  ctx.fillStyle = "#ffcf5a";
  ctx.beginPath();
  ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
  ctx.fill();
}

function drawCenterText(title, sub) {
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.font = "bold 32px 'Malgun Gothic', sans-serif";
  ctx.fillText(title, W / 2, H / 2 - 10);
  ctx.font = "16px 'Malgun Gothic', sans-serif";
  ctx.fillText(sub, W / 2, H / 2 + 24);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  stars.forEach(drawStar);
  drawPlayer();
  if (state === "ready") drawCenterText("준비!", "스페이스바 또는 클릭으로 시작");
  if (state === "over") drawCenterText("게임 오버", `점수 ${Math.floor(score / 6)} · 다시 하려면 스페이스바/클릭`);
}

function loop(t) {
  const dt = Math.min(3, (t - lastTime) / (1000 / 60)) || 1; // 60fps 기준 보정
  lastTime = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// 입력
window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (e.code === "Space") {
    e.preventDefault();
    if (state !== "playing") reset();
  }
});
window.addEventListener("keyup", e => { keys[e.key] = false; });

function toCanvasX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) * (W / rect.width);
}
canvas.addEventListener("pointerdown", e => {
  if (state !== "playing") reset();
  pointerX = toCanvasX(e.clientX);
});
canvas.addEventListener("pointermove", e => {
  if (e.pointerType === "mouse" || e.buttons) pointerX = toCanvasX(e.clientX);
});
canvas.addEventListener("pointerleave", () => { pointerX = null; });
canvas.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") pointerX = null; });

requestAnimationFrame(loop);
</script>
</body>
</html>
